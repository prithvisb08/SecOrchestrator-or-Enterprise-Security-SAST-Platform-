apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "security-platform.fullname" . }}
  labels:
    {{- include "security-platform.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "security-platform.selectorLabels" . | nindent 6 }}
