replicaCount: 3

image:
  repository: internal-registry.company.com/security/orchestrator
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

metrics:
  enabled: true
  path: /metrics
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: security.company.com
      paths:
        - path: /
          pathType: Prefix