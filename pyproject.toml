[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security_platform"
version = "1.0.0"
description = "Enterprise Security Orchestration Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prometheus-client>=0.17.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
sec-scan = "security_platform.cli:app"
security-platform = "security_platform.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --ignore=examples --ignore=requests"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
